{% extends 'base.html' %}
{% load static %}


{% block head %}<link rel="stylesheet" href="{% static 'css/components/auth.css' %}?v={{ ASSET_VERSION }}">{% endblock %}

{% block content %}
  <div class="auth">
    <div class="auth__glow"></div>
    <div class="auth__card">
      <h1>{{ page_title }}</h1>
      <p class="sub">Si existe una cuenta con ese correo, te enviamos un enlace para
        restablecer tu contraseña. Revisa también la carpeta de spam.</p>
      <a class="auth__submit" href="{% url 'users:login' %}" style="display:grid;place-items:center;text-decoration:none;">Volver a ingresar</a>
    </div>
  </div>
{% endblock %}
