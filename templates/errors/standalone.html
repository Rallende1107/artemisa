{% load static fondos %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ status_code }}</title>
  <link rel="stylesheet" href="{% static 'css/00-tokens.css' %}?v={{ ASSET_VERSION }}">
  <link rel="stylesheet" href="{% static 'css/01-base.css' %}?v={{ ASSET_VERSION }}">
  <link rel="stylesheet" href="{% static 'css/components/hero.css' %}?v={{ ASSET_VERSION }}">
  <style>
    .err { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 24px; }
    .err__card {
      background: rgba(20, 20, 30, 0.16);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 560px;
    }
    .err__code { font-family: var(--mono); font-size: clamp(80px, 18vw, 180px); font-weight: 700; line-height: 1; color: var(--warn); text-shadow: 0 0 30px rgba(236,0,140,.4); }
    .err h1 { font-size: 26px; margin: 8px 0 10px; }
    .err p { color: var(--warn); font-weight: 700; max-width: 46ch; margin: 0 auto 24px; }
  </style>
</head>
<body>
  <div class="bg-layer {{ background_image|bg_clase }}"{% bg_style background_image %}></div>
  <div class="err"><div class="err__card">
    <div class="err__code">{{ status_code }}</div>
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
    <div class="cta-row" style="justify-content:center"><a class="btn-hero" href="{{ home_url }}">{{ cta_label }}</a></div>
  </div></div>
</body>
</html>
