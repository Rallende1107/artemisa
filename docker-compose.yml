# Artemisa en Docker — stack completo estilo Poseidón:
#   nginx (puerta de entrada) → web (gunicorn) · worker + beat (Celery/redis)
#   · Postgres · pgAdmin.
# La config de Django sale del .env (settings único); compose solo inyecta lo
# propio del contenedor (BD en el servicio db, broker en redis).
#   Levantar:  docker compose up --build
#   Sitio:     http://localhost:8000 (WEB_PORT) · pgAdmin: http://localhost:5050
#   Logs:      http://localhost:8888 (Dozzle, DOZZLE_PORT)
#   Proxy:     http://localhost:81 (Nginx Proxy Manager, NPM_ADMIN_PORT) → publica el sitio en 80/443

x-django: &django
  build: .
  env_file: .env
  environment: &django-env
    DB_ENGINE: django.db.backends.postgresql
    DB_NAME: ${DB_NAME:-artemisa}
    DB_USER: ${DB_USER:-artemisa}
    DB_PASSWORD: ${DB_PASSWORD:-artemisa}
    DB_HOST: db
    DB_PORT: "5432"
    USE_MANIFEST: ${USE_MANIFEST:-0}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
    CELERY_ENABLED: "1"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  volumes:
    - ./media:/app/media
    - ./dump:/app/dump     # backups completos (backup/loadbackup) visibles fuera
    # CODIGO Y ESTATICOS EN VIVO: con DEV=1 el web corre runserver y se recarga
    # solo al guardar; sin DEV, sirven para que un fondo nuevo entre sin rebuild.
    - ./apps:/app/apps
    - ./core:/app/core
    - ./templates:/app/templates
    - ./locale:/app/locale
    - ./static:/app/static
    - ./manage.py:/app/manage.py
  restart: unless-stopped

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/srv/media:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    <<: *django

  worker:
    <<: *django
    command: celery -A core worker -l info --concurrency=2   # 2 procesos: el lote sigue mientras otro toma las tandas de álbumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *django
    command: celery -A core beat -l info
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    # Puerto publicado SOLO para desarrollo: así el `runserver` local (y pgAdmin
    # de escritorio, DBeaver…) hablan con la MISMA BD que ve el stack.
    # 55432 en el host para NO chocar con un Postgres instalado en Windows.
    ports:
      - "${DB_PORT_HOST:-55432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-artemisa}
      POSTGRES_USER: ${DB_USER:-artemisa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-artemisa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-artemisa} -d ${DB_NAME:-artemisa}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # pgAdmin (PGADMIN_EMAIL / PGADMIN_PASSWORD del .env; el servidor «Artemisa»
  # ya viene registrado — solo pide la clave de la BD al conectar).
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@frikiverso.cl}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Dozzle: los logs de TODOS los contenedores del stack, en vivo y en el navegador (sin `docker compose logs`).
  # Solo LEE el socket de Docker (:ro) y solo escucha en 127.0.0.1: los logs pueden llevar datos sensibles,
  # así que no se publica a la red. El filtro deja ver únicamente los contenedores de ESTE proyecto.
  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-web-artemisa}
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Nginx Proxy Manager: la puerta de entrada con dominio y HTTPS (Let's Encrypt) desde un panel web.
  # NO sustituye al nginx del stack: va DELANTE. Un «Proxy Host» apunta a  nginx:80  (el nombre del servicio,
  # dentro de la red de compose) y NPM se encarga del dominio y del certificado.
  # El panel de administración (81) solo escucha en 127.0.0.1; el 80 y el 443 sí se publican.
  npm:
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin:
  npm_data:
  npm_letsencrypt:
