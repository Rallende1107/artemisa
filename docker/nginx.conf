# nginx delante de gunicorn: proxy del sitio + media servida directo.
# Los estáticos los sirve whitenoise (comprimidos) a través del proxy.
server {
    listen 80;
    client_max_body_size 25m;

    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
    }

    # Resolver de Docker, revisado cada 10 s. Con `proxy_pass http://web:8000` a secas, nginx averigua la IP
    # de `web` UNA vez al arrancar y se la queda: cuando `web` se recrea (up -d, cambio de DEV…) recibe otra
    # IP y nginx sigue llamando a la vieja → 502 hasta reiniciar nginx. Con la dirección en una variable,
    # nginx la vuelve a preguntar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://web:8000;

    location / {
        proxy_pass $web_upstream;
        # Host CON puerto ($http_host): con $host (sin puerto) el chequeo CSRF
        # de origen compara localhost vs localhost:8000 y bloquea todo POST.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
